services:
  db:
    image: postgres:16-alpine
    container_name: employee-management-db
    environment:
      POSTGRES_DB: employee_app
      POSTGRES_USER: manager
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - 5432:5432	 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manager -d employee_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: employee-backend
    volumes:
      - uploads_data:/app/uploads
    environment:
      DATABASE_URL: postgresql+psycopg2://manager:${DB_PASSWORD}@db:5432/employee_app
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: employee-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  uploads_data:
